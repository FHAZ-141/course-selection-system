# ============================================================
#  Render 部署蓝图（Infrastructure as Code）
#
#  用法：Render 控制台 → New → Blueprint → 选择本仓库 → Apply
#
#  说明：
#   · runtime 用 node（不用 Docker），符合需求 F2「不做 Docker 部署」
#   · region 选 singapore，是 Render 离国内最近的节点
#   · 数据库在 Neon（PostgreSQL），数据持久保留；startCommand 里的 seed 是幂等的
#     （库里有数据就跳过），所以重启不会重置演示数据
#   · DATABASE_URL 用 sync: false 声明：键必须在蓝图里，值只在控制台维护，
#     这样既能防止蓝图同步把变量删掉，又不会把密码写进仓库
#   · 健康检查指向 /health，与启动器用的是同一个端点
# ============================================================

services:
  - type: web
    name: course-selection-system
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # 会话签名密钥，由 Render 自动生成随机值
      - key: SESSION_SECRET
        generateValue: true

      # PostgreSQL 连接串。sync: false = 键属于蓝图、值只在控制台填（不进仓库）。
      # 必须在此声明：蓝图同步会清理「不在蓝图里的环境变量」，
      # 缺了这一项 DATABASE_URL 会被静默删除，线上会回退到 SQLite。
      - key: DATABASE_URL
        sync: false
